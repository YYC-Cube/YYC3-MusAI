name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10'

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests + coverage gate (>=80%)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Build component docs
        run: pnpm docs:build

      - name: Archive build artifacts
        run: tar -czf d-music-dist.tar.gz -C apps/d-music/dist .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: d-music-dist
          path: d-music-dist.tar.gz
          retention-days: 7

  server-integration:
    name: Deno Integration (music-server)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Deno integration tests
        working-directory: packages/music-server
        run: deno test --allow-all test-deno

      - name: Deno coverage gate (>=80%)
        working-directory: packages/music-server
        run: |
          rm -rf /tmp/deno-cov
          deno test --allow-all --coverage=/tmp/deno-cov test-deno
          deno coverage /tmp/deno-cov --exclude=test-deno --exclude=src/index.tsx --lcov --output=/tmp/deno-src.lcov
          awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END {pct=lh/lf*100; printf "Deno src coverage: %.2f%% (%d/%d)\n", pct, lh, lf; exit (pct>=80?0:1)}' /tmp/deno-src.lcov

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Run audit (blocking)
        run: pnpm audit --audit-level=high
        env:
          npm_config_registry: https://registry.npmjs.org

  # 部署由 .github/workflows/deploy-pages.yml 负责（GitHub Pages + musai.yyc3.vip）
