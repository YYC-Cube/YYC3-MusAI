# ============================================================================
# YYC³ MusAI PostgreSQL 主库 pg_hba.conf
# 部署位置：NAS 192.168.3.45 的 PostgreSQL 数据目录（PG17.11）
# 生效：修改后执行 pg_ctl reload -D <data_dir> 或 SELECT pg_reload_conf();
# ============================================================================

# ----------------------------------------------------------
# 1. 本地 Socket 连接（仅数据库管理/运维，限 NAS 本机）
# ----------------------------------------------------------
local   all             postgres                                peer
local   all             musai_app_rw                            scram-sha-256
local   all             all                                     reject

# ----------------------------------------------------------
# 2. IPv4 本地回环（仅本机应用/运维）
# ----------------------------------------------------------
host    all             all             127.0.0.1/32            scram-sha-256
host    replication     replicator      127.0.0.1/32            scram-sha-256

# ----------------------------------------------------------
# 3. IPv4 应用连接（生产环境：应用服务器 → NAS 主库）
#    musai 服务端（容器 host 网络）以 musai_app_rw 写入 yyc3_music
# ----------------------------------------------------------
# 应用服务器网段（按实际 VLAN/子网替换，示例 192.168.3.0/24）
host    yyc3_music      musai_app_rw    192.168.3.0/24          scram-sha-256
host    yyc3_music      musai_app_rw    10.0.0.0/8              scram-sha-256

# 只读从库（本机 127.0.0.1:5433）用于报表/灾备，禁止写入
host    yyc3_music      musai_app_ro    127.0.0.1/32            scram-sha-256

# ----------------------------------------------------------
# 4. IPv4 流复制连接（从库 → 主库）
# ----------------------------------------------------------
host    replication     replicator      192.168.3.0/24          scram-sha-256

# ----------------------------------------------------------
# 5. IPv6 本地连接
# ----------------------------------------------------------
host    all             all             ::1/128                 scram-sha-256

# ----------------------------------------------------------
# 6. 默认拒绝所有其他连接（安全底线）
# ----------------------------------------------------------
host    all             all             0.0.0.0/0               reject
host    all             all             ::/0                    reject
