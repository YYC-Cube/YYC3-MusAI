# YYC³ MusAI · NAS nginx 反向代理
# 监听 80/443，将请求转发至 host 网络下的 yyc3-musai-server (127.0.0.1:3250)
# 域名：musai.yyc3.vip

# ==========================================
# HTTP → HTTPS 跳转
# ==========================================
server {
    listen 80;
    server_name musai.yyc3.vip;
    return 301 https://$host$request_uri;
}

# ==========================================
# HTTPS 反代主站
# ==========================================
server {
    listen 443 ssl http2;
    server_name musai.yyc3.vip;

    ssl_certificate     /etc/nginx/ssl/musai.yyc3.vip.crt;
    ssl_certificate_key /etc/nginx/ssl/musai.yyc3.vip.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 反代至 musai 服务端（host 网络，直接监听 3250）
    location / {
        proxy_pass http://127.0.0.1:3250;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 健康探针直通（供 NAS/Docker 健康检查使用）
    location /health {
        proxy_pass http://127.0.0.1:3250/health;
        access_log off;
    }

    # 静态资源（如前端已部署至 nginx，可取消注释）
    # location /assets/ {
    #     alias /Volume3/docker/yyc3-musai-server/assets/;
    #     expires 30d;
    #     add_header Cache-Control "public, immutable";
    # }
}
