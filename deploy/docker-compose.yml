# ================================================================================
# YYC³ MusAI Server —— yyc3-45 Docker Compose
#
# 用法：
#   cp deploy/musai-server.env.example deploy/musai-server.env  # 填真实口令
#   docker compose -f deploy/docker-compose.yml up -d --build
#   deploy/scripts/healthcheck.sh
#
# 回滚：修改 MUSAI_TAG 后重新 up -d，或直接执行 deploy/scripts/rollback.sh
# ================================================================================
services:
  musai-server:
    container_name: musai-server
    image: ${MUSAI_IMAGE:-yyc3/musai-server}:${MUSAI_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ./musai-server.env
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
    ports:
      - "${MUSAI_PORT:-3250}:8080"
    restart: unless-stopped
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
